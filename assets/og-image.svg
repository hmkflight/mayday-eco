<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#F4EDE1"/>
  <rect x="30" y="30" width="1140" height="570" fill="none" stroke="#8F7F6C" stroke-width="1.5" stroke-dasharray="4 10"/>
  <text x="100" y="230" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="600" fill="#241E1A">You granted a wish.</text>
  <text x="100" y="320" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="600" fill="#241E1A">Now tell us how it felt.</text>
  <text x="100" y="400" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#6A5C50">A wall of proof that kindness spreads.</text>
  <text x="100" y="560" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="600" fill="#B23924">mayday.eco</text>
